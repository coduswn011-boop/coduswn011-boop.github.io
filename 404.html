<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | 노벨짐 24 채용</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Noto Sans KR", sans-serif; color: #F3F1EC;
      background: radial-gradient(800px 400px at 50% 20%, rgba(201,162,39,.16), transparent 65%), #0B0B0C;
      text-align: center;
    }
    .medal {
      width: 82px; height: 82px; margin: 0 auto 26px; border-radius: 50%;
      background: conic-gradient(from 210deg, #8E7016, #E8C766, #C9A227, #8E7016);
      display: grid; place-items: center;
      font-family: "Cormorant Garamond", serif; font-size: 30px; color: #17140A; font-weight: 700;
      box-shadow: 0 0 0 6px rgba(201,162,39,.12);
    }
    h1 { font-family: "Cormorant Garamond", serif; font-size: 62px; color: #E8C766; line-height: 1; margin-bottom: 14px; }
    h2 { font-size: 20px; font-weight: 900; margin-bottom: 12px; }
    p { color: #9AA0A9; font-size: 14.5px; margin-bottom: 30px; line-height: 1.8; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block; padding: 13px 26px; border-radius: 4px;
      font-weight: 700; font-size: 14.5px; text-decoration: none;
    }
    .primary { background: linear-gradient(135deg, #E8C766, #C9A227); color: #17140A; }
    .ghost { border: 1px solid rgba(232,199,102,.5); color: #E8C766; }
  </style>
</head>
<body>
  <main>
    <div class="medal">N</div>
    <h1>404</h1>
    <h2>페이지를 찾을 수 없습니다</h2>
    <p>주소가 바뀌었거나 마감된 공고일 수 있습니다.<br />채용공고 목록에서 현재 열려 있는 포지션을 확인해 주세요.</p>
    <div class="btns">
      <a class="primary" href="/#jobs">채용공고 보기</a>
      <a class="ghost" href="/">홈으로</a>
    </div>
  </main>
</body>
</html>
